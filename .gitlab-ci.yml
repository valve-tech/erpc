# Dev CI on the self-hosted GitLab. Mirrors the unit-test job of
# .github/workflows/test.yml (upstream runs `make test-fast`; this runs
# plain vet + test, sized for slow untagged shared runners, minus the
# tests that need a Docker daemon).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

default:
  image: golang:1.25.1

variables:
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build

cache:
  key:
    files:
      - go.sum
  paths:
    - .cache/go-mod
    - .cache/go-build

test:
  timeout: 1h
  before_script:
    # valvebilling tests need a real redis-server (see test.yml).
    - apt-get update -qq && apt-get install -y -qq redis-server
  script:
    - go vet ./...
    # The shared runners are docker executors with no Docker daemon, so a
    # testcontainers-backed test fails at 0.00s with "rootless Docker not
    # found" (pipeline 3059). Skip exactly those tests, by name: a new
    # container test still fails here, loudly, until someone adds it.
    # .github/workflows/test.yml has Docker and runs all of them.
    # -p 1 -parallel 1: the erpc tests share gock's process-global mock and
    # some are timing-sensitive. With -p 2 -parallel 2, pipeline 3112 failed
    # three different erpc tests in two runs on Go code that 3111 passed.
    - |
      CONTAINER_TESTS='^(TestDynamoDBConnector_CRUD|TestDynamoDBConnectorInitialization|TestDynamoDBConnectorReverseIndex|TestDynamoDBDistributedLocking|TestPostgreConnectorInitialization|TestPostgreSQLDistributedLocking|TestPostgreSQLConnector_CRUD|TestPostgreSQLConnector_DatabasePaths|TestPostgreSQLConnector_SchemaAndListenerPaths|TestPostgreSQLConnector_MigratesALegacyTextValueColumn|TestPostgreSQLConnector_UnusableTableNameFailsAtStartup|TestPostgreSQLConnector_LockAndUnlockFailurePaths|TestPostgreSQLConnector_WatchCounterInt64_ReleasesTheListenerConnection|TestPostgreSQLConnector_WatchCounterInt64_AListenerSurvivesItsFirstWatcher|TestPostgreSQLConnector_Reconnect|TestPostgreSQLConnector_WatchCleanupLeaksItsFallbackPoller|TestRedisConnector_ListPaginatesOnRealRedis|TestRedisConnector_ApiKeyAddressRoundTripsOnRealRedis|TestRedisPubSubManager_Reconnect|TestEvmJsonRpcCache_DynamoDB|TestEvmJsonRpcCache_Redis)$'
      go test -p 1 -count 1 -parallel 1 -timeout 30m -skip "$CONTAINER_TESTS" ./...
    # The two *Initialization tests above also hold a subtest that needs no
    # container. -skip cannot drop one subtest without its siblings, so run
    # those siblings here.
    - go test -count 1 -timeout 5m -run '^(TestDynamoDBConnectorInitialization|TestPostgreConnectorInitialization)$/^(fails|Fails)' ./data
