# Dev CI on the self-hosted GitLab. Mirrors the unit-test job of
# .github/workflows/test.yml (upstream runs `make test-fast`; this runs
# plain vet + test, sized for slow untagged shared runners, minus the
# tests that need a Docker daemon; the erpc package reports without
# blocking).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

default:
  image: golang:1.26.0

variables:
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build

cache:
  key:
    files:
      - go.sum
  paths:
    - .cache/go-mod
    - .cache/go-build

# The shared runners are docker executors with no Docker daemon, so a
# testcontainers-backed test fails at 0.00s with "rootless Docker not found"
# (pipeline 3059). Both jobs skip exactly those tests, by name: a new
# container test still fails here, loudly, until someone adds it.
# .github/workflows/test.yml has Docker and runs all of them.
.container-tests:
  script:
    - export CONTAINER_TESTS='^(TestDynamoDBConnector_CRUD|TestDynamoDBConnectorInitialization|TestDynamoDBConnectorReverseIndex|TestDynamoDBDistributedLocking|TestPostgreConnectorInitialization|TestPostgreSQLDistributedLocking|TestPostgreSQLConnector_CRUD|TestPostgreSQLConnector_DatabasePaths|TestPostgreSQLConnector_SchemaAndListenerPaths|TestPostgreSQLConnector_MigratesALegacyTextValueColumn|TestPostgreSQLConnector_UnusableTableNameFailsAtStartup|TestPostgreSQLConnector_LockAndUnlockFailurePaths|TestPostgreSQLConnector_WatchCounterInt64_ReleasesTheListenerConnection|TestPostgreSQLConnector_WatchCounterInt64_AListenerSurvivesItsFirstWatcher|TestPostgreSQLConnector_Reconnect|TestPostgreSQLConnector_WatchCleanupLeaksItsFallbackPoller|TestRedisConnector_ListPaginatesOnRealRedis|TestRedisConnector_ApiKeyAddressRoundTripsOnRealRedis|TestRedisPubSubManager_Reconnect|TestEvmJsonRpcCache_DynamoDB|TestEvmJsonRpcCache_Redis|TestDynamoDBConnector_EnsuresReverseIndexOnExistingTable|TestDynamoDBConnector_GetSetDelete|TestDynamoDBConnector_GetSimpleValueShapes|TestDynamoDBConnector_List|TestDynamoDBConnector_LockErrors|TestDynamoDBConnector_ReverseIndexGet|TestDynamoDBConnector_WatchCounter|TestPostgreSQLConnector_CleanupExpiredRemovesOnlyExpiredRows|TestPostgreSQLConnector_ConnectFailsFast|TestPostgreSQLConnector_ConnectionLossTriggersRecovery|TestPostgreSQLConnector_EmptyAndNilValues|TestPostgreSQLConnector_LegacyV4URIKeysConnect|TestPostgreSQLConnector_List|TestPostgreSQLConnector_ListenerSurvivesBackendTermination|TestPostgreSQLConnector_MigratesLegacyTextValueColumn|TestPostgreSQLConnector_Purge_SingleConnAndSuffixIsolation|TestPostgreSQLConnector_ReconnectSwapsPoolWithoutReapplyingSchema|TestPostgreSQLConnector_SchemaFailureLeavesConnectorNotReady|TestPostgreSQLConnector_SetGetDelete|TestPostgreSQLConnector_SkipSchemaSetupOnMissingTable|TestPostgreSQLConnector_Unlock|TestPostgreSQLConnector_WatchAndPublishCounter|TestPostgreSQLConnector_WatchCounterSkipsUnparsableStoredValue|TestPostgreSQLConnector_WildcardGet)$'

test:
  timeout: 1h
  before_script:
    # valvebilling tests need a real redis-server (see test.yml).
    - apt-get update -qq && apt-get install -y -qq redis-server
  script:
    - go vet ./...
    - !reference [.container-tests, script]
    # Every package except erpc. erpc runs in test-erpc below.
    # TestEvaluate_ReusesVMBetweenCalls: quarantined, bug log entry 202.
    - go test -p 2 -count 1 -parallel 2 -timeout 30m -skip "$CONTAINER_TESTS|^TestEvaluate_ReusesVMBetweenCalls$" $(go list ./... | grep -v '^github.com/erpc/erpc/erpc$')
    # The two *Initialization tests in the skip list also hold a subtest
    # that needs no container. -skip cannot drop one subtest without its
    # siblings, so run those siblings here.
    - go test -count 1 -timeout 5m -run '^(TestDynamoDBConnectorInitialization|TestPostgreConnectorInitialization)$/^(fails|Fails)' ./data

# The erpc package. It blocks: 0.3.0.9-valve shipped green with a test that
# failed 10 of 10 because this job only reported. GitHub's test.yml is
# disabled in this fork, so nothing else gates erpc.
#
# QUARANTINE names tests that failed here at random on unchanged code
# (pipelines 4677-4701). Each has an open entry in valve/upstream-bug-log.md
# (196, 202). Remove a name when its entry is fixed; never add one without an
# entry. A runner system failure retries once.
test-erpc:
  timeout: 1h
  allow_failure: false
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]
  before_script:
    # Same toolchain as test: some erpc tests start a real redis-server.
    - apt-get update -qq && apt-get install -y -qq redis-server
  script:
    - !reference [.container-tests, script]
    - export QUARANTINE='^(TestAdminApi_ReadOnlyMethods|TestWebSocket_SubscriptionDedup|TestWebSocket_UnsubscribeIsScopedToConnection|TestInit_ServesTheSecondCallFromTheCacheItsConfigNames)$'
    - go test -count 1 -parallel 2 -timeout 30m -skip "$CONTAINER_TESTS|$QUARANTINE" ./erpc
