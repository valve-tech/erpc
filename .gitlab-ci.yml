# Dev CI on the self-hosted GitLab. Mirrors the unit-test job of
# .github/workflows/test.yml (upstream runs `make test-fast`; this runs
# plain vet + test, sized for slow untagged shared runners, minus the
# tests that need a Docker daemon; the erpc package reports without
# blocking).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

default:
  image: golang:1.25.1

variables:
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build

cache:
  key:
    files:
      - go.sum
  paths:
    - .cache/go-mod
    - .cache/go-build

# The shared runners are docker executors with no Docker daemon, so a
# testcontainers-backed test fails at 0.00s with "rootless Docker not found"
# (pipeline 3059). Both jobs skip exactly those tests, by name: a new
# container test still fails here, loudly, until someone adds it.
# .github/workflows/test.yml has Docker and runs all of them.
.container-tests:
  script:
    - export CONTAINER_TESTS='^(TestDynamoDBConnector_CRUD|TestDynamoDBConnectorInitialization|TestDynamoDBConnectorReverseIndex|TestDynamoDBDistributedLocking|TestPostgreConnectorInitialization|TestPostgreSQLDistributedLocking|TestPostgreSQLConnector_CRUD|TestPostgreSQLConnector_DatabasePaths|TestPostgreSQLConnector_SchemaAndListenerPaths|TestPostgreSQLConnector_MigratesALegacyTextValueColumn|TestPostgreSQLConnector_UnusableTableNameFailsAtStartup|TestPostgreSQLConnector_LockAndUnlockFailurePaths|TestPostgreSQLConnector_WatchCounterInt64_ReleasesTheListenerConnection|TestPostgreSQLConnector_WatchCounterInt64_AListenerSurvivesItsFirstWatcher|TestPostgreSQLConnector_Reconnect|TestPostgreSQLConnector_WatchCleanupLeaksItsFallbackPoller|TestRedisConnector_ListPaginatesOnRealRedis|TestRedisConnector_ApiKeyAddressRoundTripsOnRealRedis|TestRedisPubSubManager_Reconnect|TestEvmJsonRpcCache_DynamoDB|TestEvmJsonRpcCache_Redis)$'

test:
  timeout: 1h
  before_script:
    # valvebilling tests need a real redis-server (see test.yml).
    - apt-get update -qq && apt-get install -y -qq redis-server
  script:
    - go vet ./...
    - !reference [.container-tests, script]
    # Every package except erpc. erpc runs in test-erpc below.
    - go test -p 2 -count 1 -parallel 2 -timeout 30m -skip "$CONTAINER_TESTS" $(go list ./... | grep -v '^github.com/erpc/erpc/erpc$')
    # The two *Initialization tests in the skip list also hold a subtest
    # that needs no container. -skip cannot drop one subtest without its
    # siblings, so run those siblings here.
    - go test -count 1 -timeout 5m -run '^(TestDynamoDBConnectorInitialization|TestPostgreConnectorInitialization)$/^(fails|Fails)' ./data

# The erpc package holds many timing-sensitive tests. On these slow shared
# runners, six pipelines (3111-3139) hit ten different ones, on Go code
# that passed elsewhere. This job reports them without blocking: a failure
# shows as a warning with its full log. GitHub's test.yml still runs erpc
# and stays the blocking gate for it. Log each flake this job finds in
# valve/upstream-bug-log.md, so it gets a root-cause fix.
test-erpc:
  timeout: 1h
  allow_failure: true
  before_script:
    # Same toolchain as test: some erpc tests start a real redis-server.
    - apt-get update -qq && apt-get install -y -qq redis-server
  script:
    - !reference [.container-tests, script]
    - go test -count 1 -parallel 2 -timeout 30m -skip "$CONTAINER_TESTS" ./erpc
