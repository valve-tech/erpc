# Valve-owned release workflow.
#
# The upstream `release.yml` is disabled in this fork along with the other
# fork-hostile inherited workflows: it gates on
# `github.repository_owner == 'erpc'`, targets blacksmith runners we don't have,
# and drives a release-PR/changelog flow that fights our tag convention.
#
# Those six (CodeQL, release, publish-npm, benchmark, xray, Dependency Review)
# are disabled as a repo setting with `gh workflow disable`, not by editing
# their files: upstream owns the files, and an edit conflicts at every rebase.
# A rebase can switch them back on — the 0.3.0 rebase did. After each one, run
# `gh workflow list -R valve-tech/erpc --all` and disable any that is active.
#
# This produces exactly what valve consumes, and nothing else:
#
#   * linux/amd64  — the fleet. Byte-for-byte the same build the on-box
#     `build-erpc-binary` deploy step performs today (CGO_ENABLED=0, the same
#     -ldflags stamping common.ErpcVersion / common.ErpcCommitSha), so
#     `erpc --version` keeps reporting the tag rather than "dev" and the
#     published artifact is a drop-in for the compile-on-the-box path.
#   * linux/arm64, darwin/arm64, darwin/amd64 — valve-node users, who run on
#     hardware we don't choose. Today every client's ReleaseURL in
#     valve-node-app is noReleaseURL, so setup ALWAYS falls back to BuildCmd
#     and a user setting up a node compiles from source on their own machine.
#
# Go cross-compiles cleanly with CGO disabled, so all four targets build on one
# amd64 runner — no QEMU, no native arm64 runner needed. (That is NOT true for
# the Rust forks: reth and lighthouse-pulse need native runners per target,
# because emulated Rust builds are pathologically slow. See
# docs/superpowers/specs/2026-07-25-multiarch-release-pipeline.md in the
# monorepo.)
#
# Container image: the `image` job also publishes ghcr.io/valve-tech/erpc, a
# linux/amd64 + linux/arm64 manifest list assembled from the linux binaries
# above (Dockerfile.valve just COPYs them; no QEMU, no recompile). It is
# tagged with the valve-* tag, its manifest digest goes in the job summary and
# the release asset erpc-image-digest.txt, and it carries a build-provenance
# attestation. A workflow_dispatch run builds the image but never pushes it.
# After the first publish the ghcr package must be made public by hand.
#
# Triggered only by pushing a tag, or by hand. Never on push-to-main — a
# release is a deliberate act.
name: valve-release

on:
  push:
    tags:
      - 'valve-*'
      # Version tags, such as 0.3.0.2-valve.
      - '[0-9]*-valve'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. valve-ws-v1)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      # Validate BEFORE the tag reaches `checkout`'s ref: or any run: block.
      # workflow_dispatch input is attacker-controlled in the general case
      # (here only by write-access users, but the cost of pinning it is zero),
      # and an unvalidated value in `ref:` is a ref-injection primitive.
      # Anchored allowlist: this fork's releases are `valve-*` or a version
      # tag `<digits...>-valve`, such as 0.3.0.2-valve.
      - name: Validate tag input
        id: vars
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # TWO checks, and both are load-bearing. A single
          # `valve-[A-Za-z0-9._-]*` glob is NOT sufficient: the trailing `*` in
          # a shell case pattern matches ANY characters, so `valve-ok;rm -rf /`
          # sails through it. Require the prefix, then separately reject any
          # character outside the allowed class anywhere in the string.
          case "$RAW_TAG" in
            valve-?*) ;;
            [0-9]*-valve) ;;
            *) echo "::error::refusing tag '$RAW_TAG' — must start with 'valve-' or be a version tag ending in '-valve'"; exit 1 ;;
          esac
          case "$RAW_TAG" in
            *[!A-Za-z0-9._-]*)
              echo "::error::refusing tag '$RAW_TAG' — contains characters outside [A-Za-z0-9._-]"
              exit 1 ;;
          esac
          printf 'tag=%s\n' "$RAW_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Safe: validated against the allowlist above.
          ref: ${{ steps.vars.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Resolve commit
        id: sha
        run: printf 'sha=%s\n' "$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build all targets
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Keep these ldflags identical to the on-box build in the monorepo's
          # `build-erpc-binary` step. If they drift, the published binary and
          # the compiled-on-box binary stop being interchangeable.
          LDFLAGS="-w -s -X github.com/erpc/erpc/common.ErpcVersion=${TAG} -X github.com/erpc/erpc/common.ErpcCommitSha=${SHA}"
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            out="dist/erpc-${GOOS}-${GOARCH}"
            echo "==> ${out}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags="$LDFLAGS" -o "$out" ./cmd/erpc
          done
          ls -la dist/

      - name: Smoke-test the native binary
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          # Only linux/amd64 is executable on this runner. It is also the one
          # the fleet runs, so a --version that reports the tag proves the
          # ldflags stamping survived; "dev" here means the stamp path broke.
          # TAG goes through env, not expression interpolation into the script.
          # Never write the expression opener in a comment here: GitHub parses
          # it inside run: blocks, and the whole file then fails to load.
          chmod +x dist/erpc-linux-amd64
          OUT=$(./dist/erpc-linux-amd64 --version)
          echo "$OUT"
          printf '%s' "$OUT" | grep -qF -- "$TAG" \
            || { echo "::error::--version did not report the tag; ldflags stamping is broken"; exit 1; }

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist && sha256sum erpc-* > SHA256SUMS && cat SHA256SUMS

      - name: Keep the linux binaries for the image job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-binaries
          path: |
            dist/erpc-linux-amd64
            dist/erpc-linux-arm64
          if-no-files-found: error
          retention-days: 1

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            dist/erpc-*
            dist/SHA256SUMS
          body: |
            Valve build of the eRPC fork at `${{ steps.vars.outputs.tag }}` (`${{ steps.vars.outputs.sha }}`).

            Static `CGO_ENABLED=0` binaries. `linux/amd64` matches the build the
            valve deploy performs on-box, so it is a drop-in for that path.

            Verify:
            ```
            sha256sum -c SHA256SUMS --ignore-missing
            ```

  # Multi-arch container image from the binaries the build job produced.
  # Push only for a real tag push; a manual dispatch builds and discards.
  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/valve-tech/erpc
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Validated by the build job's allowlist.
          ref: ${{ needs.build.outputs.tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-binaries
          path: imgctx

      - name: Stage the Dockerfile in the build context
        run: cp Dockerfile.valve imgctx/Dockerfile

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on a tag) the multi-arch image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: imgctx
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build.outputs.tag }}
          # Provenance is the GitHub attestation below; BuildKit's own would
          # add attestation manifests to the index and change what the digest
          # names.
          provenance: false
          sbom: false

      - name: Attest build provenance
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write the digest where jumpgate can pin it
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s@%s\n' "$IMAGE" "$DIGEST" | tee erpc-image-digest.txt
          {
            echo "### eRPC image ($TAG)"
            echo
            echo "pushed: $PUSH"
            echo
            echo '```'
            cat erpc-image-digest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest
          path: erpc-image-digest.txt

  # Own job so the token that can write releases never sits beside the one
  # that can write packages.
  image-digest-asset:
    needs: [build, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-digest
      - name: Attach erpc-image-digest.txt to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release upload "$TAG" erpc-image-digest.txt --clobber --repo "$GITHUB_REPOSITORY"
