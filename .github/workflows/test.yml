name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  units:
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04' }}"
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.x'
      - name: Install dependencies
        run: make setup
      - name: Build
        run: make build
      - name: Test with the Go CLI
        run: make test-fast

  # The pre-commit hooks are the local gate. This job is the backstop for a
  # clone where nobody ran `pre-commit install`, and for anyone who reaches for
  # `--no-verify`. A gate that only runs on the machines that chose to install
  # it is not a gate.
  #
  # Scope: the pull request's own commits, not the whole tree. The local hooks
  # run on what you are about to commit, so the CI equivalent is that range.
  # `--all-files` instead judges 63 upstream-owned files that already fail
  # end-of-file-fixer and trailing-whitespace. That makes the job red on every
  # run, which teaches people to ignore it.
  #
  # Both triggers run it. This fork lands most work by pushing straight to
  # `main`, so a pull-request-only job would never run here at all — which is
  # the same non-gate as a job that is always red. The push range needs its own
  # base ref, and `github.event.before` supplies it for an ordinary push. It is
  # all zeros when a branch is created, and it names a discarded commit after a
  # force push, so the step below falls back to `HEAD~1` for both. The fallback
  # is plain shell and is covered by `valve/precommit-range-test.sh`, because an
  # untested fallback is a guess.
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # --from-ref needs the base commit, which a shallow checkout omits.
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pick the commit range to check
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: valve/precommit-range.sh >> "$GITHUB_OUTPUT"
      - name: Run every hook over the changed files
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --from-ref ${{ steps.range.outputs.base }} --to-ref ${{ github.sha }}

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.x'
      - name: Run Gosec Security Scanner
        uses: securego/gosec@5e72efc19d97e11549b3427b83fab3257a8c9894 # master
        with:
          args: -exclude=G115 -exclude-dir=test -tests=false ./...
