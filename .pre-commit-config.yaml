repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.16.3
  hooks:
  - id: gitleaks
- repo: https://github.com/golangci/golangci-lint
  rev: v2.13.0
  hooks:
  - id: golangci-lint
- repo: https://github.com/jumanjihouse/pre-commit-hooks
  rev: 3.0.0
  hooks:
  - id: shellcheck
- repo: https://github.com/pre-commit/mirrors-eslint
  rev: v8.38.0
  hooks:
  - id: eslint
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: check-merge-conflict
    # Always check, not only while .git/MERGE_HEAD exists. The markers this
    # was added for survived PAST the merge commit and were committed later,
    # when git no longer considered the tree to be in a merge.
    args: [--assume-in-merge]
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: local
  hooks:
  - id: check-bug-log
    name: check the structure of the upstream bug log
    entry: valve/check-bug-log.sh
    language: script
    files: ^valve/upstream-bug-log\.md$
    pass_filenames: false
  - id: check-fork-isolation
    name: no fork package imported from outside the fork directories
    entry: valve/check-fork-isolation.sh
    language: script
    # Any Go file can introduce the import, so any staged Go file arms the
    # check. It then scans the whole index rather than the named files,
    # because an offending import can already sit in a file this commit does
    # not touch — a rename of a fork package is the case that does it.
    files: \.go$
    pass_filenames: false
